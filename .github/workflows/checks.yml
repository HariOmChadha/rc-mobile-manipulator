name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-wireless.txt -r requirements-replay.txt -r requirements-test.txt
      - run: python scripts/check_secrets.py --staged
      - run: python -m ruff check mobile_robot scripts tests
      - run: python -m pytest -q
